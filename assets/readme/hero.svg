<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Codex Feishu Plugin (飞书工作流插件)</title>
  <desc id="hero-desc">让 Codex 通过飞书官方 lark-cli 与 lark-* skills，安全处理文档、多维表格、云盘、日历、消息、任务与审批。</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="feishu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3370FF"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D6B9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="20" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Content Area -->
  <g transform="translate(64, 46)">
    <!-- Scope Tag -->
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#1E293B"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.5">CODEX PLUGIN · POWERED BY LARK-CLI</text>

    <!-- Main Title -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Codex Feishu Plugin</text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      通过飞书官方 <tspan fill="#3370FF" font-weight="600">lark-cli</tspan> 与原生 <tspan fill="#00D6B9" font-weight="600">lark-*</tspan> 技能生态，
    </text>
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      让 Codex 安全接管飞书文档、多维表格、云盘、消息、日历与审批。
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1: 零凭据泄露 -->
      <rect x="0" y="0" width="128" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#00D6B9"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">零凭据泄露</text>

      <!-- Pill 2: 官方 CLI 驱动 -->
      <rect x="138" y="0" width="138" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="154" cy="16" r="4" fill="#3370FF"/>
      <text x="166" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">官方 CLI 驱动</text>

      <!-- Pill 3: 12+ 飞书能力矩阵 -->
      <rect x="286" y="0" width="148" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="302" cy="16" r="4" fill="#A855F7"/>
      <text x="314" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">12+ 飞书原生模块</text>

      <!-- Pill 4: 跨平台 -->
      <rect x="444" y="0" width="138" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="460" cy="16" r="4" fill="#10B981"/>
      <text x="472" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">Win / Mac / Linux</text>
    </g>

    <!-- Bottom Command Cue -->
    <g transform="translate(0, 238)">
      <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748B">
        支持场景：<tspan fill="#F1F5F9">"读多维表格"</tspan> · <tspan fill="#F1F5F9">"发飞书消息"</tspan> · <tspan fill="#F1F5F9">"查日历审批"</tspan> · <tspan fill="#F1F5F9">"编辑云文档"</tspan>
      </text>
    </g>
  </g>

  <!-- Right Visual Specimen (Feishu Capability Card) -->
  <g transform="translate(680, 36)">
    <!-- Container Card -->
    <rect width="460" height="288" rx="12" fill="#131B2A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Feishu Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 448 0 C 454.63 0 460 5.37 460 12 L 460 38 L 0 38 Z" fill="#1E293B"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    
    <!-- Status Badge -->
    <rect x="74" y="9" width="18" height="20" rx="3" fill="#3370FF"/>
    <path d="M 80 14 L 86 19 L 80 24" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="100" y="23" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0" font-weight="500">codex-feishu · lark-cli authenticated</text>

    <!-- Grid of Capability Tiles -->
    <g transform="translate(18, 52)">
      <!-- Tile 1: 多维表格 Base -->
      <rect x="0" y="0" width="204" height="64" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="14" width="36" height="36" rx="6" fill="#1E3A8A"/>
      <text x="21" y="38" font-family="-apple-system, sans-serif" font-size="18">📊</text>
      <text x="56" y="29" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">多维表格 (Base)</text>
      <text x="56" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">建表/字段/增删查改/视图</text>

      <!-- Tile 2: 云文档 Docx -->
      <rect x="220" y="0" width="204" height="64" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <rect x="232" y="14" width="36" height="36" rx="6" fill="#064E3B"/>
      <text x="241" y="38" font-family="-apple-system, sans-serif" font-size="18">📄</text>
      <text x="276" y="29" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">云文档 (Docx/Wiki)</text>
      <text x="276" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">内容编辑/插入/思维笔记</text>

      <!-- Tile 3: 即时通讯 IM -->
      <rect x="0" y="74" width="204" height="64" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="88" width="36" height="36" rx="6" fill="#4C1D95"/>
      <text x="21" y="112" font-family="-apple-system, sans-serif" font-size="18">💬</text>
      <text x="56" y="103" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">即时通讯 (IM)</text>
      <text x="56" y="119" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">收发消息/群聊/交互卡片</text>

      <!-- Tile 4: 日历与会议 -->
      <rect x="220" y="74" width="204" height="64" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
      <rect x="232" y="88" width="36" height="36" rx="6" fill="#78350F"/>
      <text x="241" y="112" font-family="-apple-system, sans-serif" font-size="18">📅</text>
      <text x="276" y="103" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">日历与会议 (Calendar)</text>
      <text x="276" y="119" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">日程排期/会议室/妙记查询</text>

      <!-- Tile 5: 任务与审批 -->
      <rect x="0" y="148" width="424" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-dasharray="3 3"/>
      <text x="14" y="172" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">
        ⚡ 扩展工作流：任务 (Task) · 审批 (Approval) · 考勤 (Attendance) · 云盘 (Drive)
      </text>
      <text x="14" y="190" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">
        由官方 lark-* skills 自动路由，支持 dry-run 审查与严格权限边界
      </text>
    </g>
  </g>
</svg>
